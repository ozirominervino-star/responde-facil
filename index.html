<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
  <title>Responde Fácil</title>
  <style>
    :root { 
      --bg: #f5f5f4; 
      --card: #ffffff; 
      --text: #1c1917; 
      --muted: #78716c; 
      --dark: #111111; 
      --soft: #f5f5f5; 
      --border: #e7e5e4; 
      --primary: #10b981; 
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--text); padding: 16px; }
    .app { max-width: 1100px; margin: 0 auto; }
    
    header { background: var(--dark); color: white; border-radius: 28px; padding: 24px; margin-bottom: 16px; display: flex; justify-content: space-between; gap: 16px; align-items: center; flex-wrap: wrap; }
    header p { margin: 0 0 6px; color: #d6d3d1; font-size: 14px; }
    h1 { margin: 0; font-size: 32px; }
    h2 { margin: 0; font-size: 22px; }
    .badge { background: rgba(255,255,255,.12); border-radius: 999px; padding: 10px 14px; font-size: 14px; }
    .status { font-size: 12px; color: #57534e; background: #eee; padding: 8px 12px; border-radius: 999px; display: inline-block; }
    
    .grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 16px; align-items: start; }
    .card { background: var(--card); border-radius: 28px; padding: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.04); min-width: 0; }
    .space > * + * { margin-top: 16px; }
    
    label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 8px; }
    input, textarea, select { width: 100%; border: 1px solid var(--border); border-radius: 18px; padding: 13px 15px; font-size: 15px; outline: none; background: white; color: var(--text); }
    textarea { resize: vertical; min-height: 120px; }
    input:focus, textarea:focus, select:focus { border-color: #111; }
    
    /* Estilização para o campo de arquivo */
    input[type="file"] { padding: 10px; font-size: 13px; background: var(--soft); cursor: pointer; }

    .searchbox { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 18px; padding: 0 12px; background: white; }
    .searchbox input { border: 0; padding-left: 0; height: 46px; }
    
    .filter-container { margin-top: 12px; }
    select.category-select { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%2378716c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>"); background-repeat: no-repeat; background-position: right 14px center; background-size: 16px; padding-right: 40px; appearance: none; cursor: pointer; font-weight: 600; }

    .list { display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow-y: auto; padding-right: 4px; margin-top: 8px; }
    
    .message-btn { width: 100%; border: 1px solid transparent; border-radius: 18px; padding: 16px; text-align: left; background: var(--soft); cursor: pointer; color: var(--text); transition: all 0.2s; }
    .message-btn:hover { background: #e7e5e4; }
    
    .message-btn.active { background: var(--dark); color: white; }
    .message-btn.active .message-title { color: white; }
    .message-btn.active .message-cat { color: #d6d3d1; background: rgba(255,255,255,0.15); }
    .message-btn.active .message-count { color: #a8a29e; }
    .message-btn.active .message-attachment-badge { background: rgba(255,255,255,0.25); color: white; }
    .message-btn.active .icon { color: white; opacity: 0.8; }
    .message-btn.active .icon:hover { background: rgba(255,255,255,0.2); opacity: 1; }

    @keyframes copyFlash {
      0% { box-shadow: 0 0 0 0px rgba(16, 185, 129, 0.6); border-color: var(--primary); }
      100% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
    }
    .message-btn.copied-effect { animation: copyFlash 0.5s ease-out; }

    .message-row { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .message-title { font-weight: 700; margin-bottom: 4px; font-size: 15px; word-break: break-word; }
    .message-info-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .message-cat { color: var(--muted); font-size: 12px; background: #e7e5e4; padding: 3px 8px; border-radius: 6px; font-weight: 600; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .message-count { font-size: 11px; color: var(--muted); }
    
    /* Tag de anexo na lista */
    .message-attachment-badge { font-size: 11px; background: #dbeafe; color: #1e40af; padding: 2px 6px; border-radius: 4px; font-weight: 600; display: inline-flex; align-items: center; gap: 2px; }

    .icons { display: flex; gap: 4px; flex-shrink: 0; }
    .icon { border: 0; background: transparent; cursor: pointer; font-size: 16px; padding: 6px; border-radius: 8px; color: var(--text); transition: all 0.2s; }
    .icon:hover { background: rgba(0,0,0,0.08); }
    
    .preview { min-height: 160px; white-space: pre-wrap; background: var(--soft); border-radius: 24px; padding: 20px; line-height: 1.5; font-size: 15px; border: 1px solid var(--border); word-break: break-word; }
    .topline { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
    .muted { color: var(--muted); font-size: 14px; margin: 0 0 4px; }
    .hint { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
    
    .preview-actions { display: flex; gap: 8px; align-items: center; }

    .btn { border: 0; background: var(--dark); color: white; padding: 13px 18px; border-radius: 18px; cursor: pointer; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.secondary { background: #eee; color: var(--text); }
    .btn.success { background: var(--primary); color: white; }
    .btn.info { background: #2563eb; color: white; }
    
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { border: 0; background: #eee; color: var(--text); padding: 9px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; }
    .chip:hover { background: #e7e5e4; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .actions { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; width: 100%; }
    .actions-left { display: flex; gap: 8px; }
    
    .file-status-info { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .attachment-preview { display: none; margin-top: 10px; border: 1px solid var(--border); background: var(--soft); border-radius: 18px; padding: 12px; }
    .attachment-preview.visible { display: block; }
    .attachment-preview img { display: block; max-width: 100%; max-height: 260px; object-fit: contain; border-radius: 14px; background: white; margin-top: 8px; }
    .attachment-name { font-size: 12px; color: var(--muted); word-break: break-word; }
    .remove-file-btn { margin-top: 8px; font-size: 12px; padding: 9px 12px; }


    @media (max-width: 850px) { 
      body { padding: 10px; } 
      .grid, .form-grid { grid-template-columns: 1fr; } 
      h1 { font-size: 26px; } 
      header, .card { border-radius: 22px; } 
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <p>App de respostas rápidas</p>
        <h1>Responde Fácil</h1>
      </div>
      <div>
        <div class="badge">💬 Saudação atual: <span id="greetingLabel"></span></div>
        <div style="height:8px"></div>
        <span class="status" id="syncStatus">Conectando ao Firebase...</span>
      </div>
    </header>

    <main class="grid">
      <section class="card space">
        <div>
          <label>Nome do cliente</label>
          <input id="clientName" placeholder="Ex: Danilo" />
        </div>
        <div>
          <label>Buscar resposta</label>
          <div class="searchbox">
            <span>🔎</span>
            <input id="search" placeholder="Pedido mínimo, revenda, SAC..." />
          </div>
          <div class="filter-container">
            <select class="category-select" id="categoryFilter">
              <option value="all">📁 Filtrar por Categoria: Todas</option>
            </select>
          </div>
        </div>
        <div class="list" id="messageList"></div>
      </section>

      <div class="space">
        <section class="card space">
          <div class="topline">
            <div>
              <p class="muted">Prévia da resposta</p>
              <h2 id="previewTitle">Nenhuma mensagem</h2>
            </div>
            <div class="preview-actions">
              <button class="btn info" id="downloadFileBtn" style="display: none;">📎 Baixar Anexo</button>
              <button class="btn" id="copyBtn">📋 Copiar</button>
            </div>
          </div>
          <div class="preview" id="previewText"></div>
          <div class="attachment-preview" id="previewAttachment"></div>
        </section>

        <section class="card space">
          <div>
            <p class="muted" id="formMode">Nova resposta</p>
            <h2 id="formTitle">Cadastrar mensagem</h2>
            <p class="hint">Dica: use os botões abaixo para inserir os campos automáticos na mensagem.</p>
          </div>
          <div class="form-grid">
            <input id="newTitle" placeholder="Título" />
            <input id="newCategory" placeholder="Categoria (Ex: Vendas, SAC)" />
          </div>
          
          <div>
            <label>Anexar Imagem ou PDF (Opcional)</label>
            <input type="file" id="newFile" accept="image/*, application/pdf" />
            <div id="fileStatusInfo" class="file-status-info"></div>
            <div id="formAttachmentPreview" class="attachment-preview"></div>
            <button type="button" class="btn secondary remove-file-btn" id="removeFileBtn" style="display:none;">Remover anexo atual</button>
          </div>

          <div class="chips">
            <button class="chip" data-insert="{saudacao}">Inserir saudação</button>
            <button class="chip" data-insert="{nome}">Inserir nome</button>
            <button class="chip" data-insert="{saudacao}, {nome}! Tudo bem?">Inserir abertura completa</button>
          </div>
          <textarea id="newText" placeholder="Digite a mensagem. Use {saudacao} e {nome} onde quiser personalizar."></textarea>
          <div class="actions">
            <div class="actions-left">
              <button class="btn" id="saveBtn">＋ Salvar mensagem</button>
              <button class="btn secondary" id="cancelBtn" style="display:none;">Cancelar edição</button>
            </div>
            <button class="btn secondary" id="exportBtn" style="font-size: 12px; padding: 10px 14px;" title="Baixar backup de segurança">💾 Exportar Backup</button>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, serverTimestamp, increment, deleteField } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDFnYw48YKLWSEFAiuTXWRY3Ki83AeGU88",
      authDomain: "responde-facil.firebaseapp.com",
      projectId: "responde-facil",
      storageBucket: "responde-facil.firebasestorage.app",
      messagingSenderId: "210022478525",
      appId: "1:210022478525:web:b9119b7e01259878ab7dd4",
      measurementId: "G-SRD5TDMRFM"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const messagesCollection = collection(db, "messages");

    let messages = [];
    let filteredMessagesCache = []; 
    let selectedId = null;
    let editingId = null;
    let firebaseReady = false;
    let currentSelectedCategory = "all"; 
    let currentBase64File = null;
    let currentFileName = null;
    let currentFileType = null;
    let currentFileSizeBytes = null;
    let fileIsPreparing = false;
    let removeExistingFile = false;

    const els = {
      greetingLabel: document.getElementById("greetingLabel"),
      syncStatus: document.getElementById("syncStatus"),
      clientName: document.getElementById("clientName"),
      search: document.getElementById("search"),
      messageList: document.getElementById("messageList"),
      previewTitle: document.getElementById("previewTitle"),
      previewText: document.getElementById("previewText"),
      copyBtn: document.getElementById("copyBtn"),
      downloadFileBtn: document.getElementById("downloadFileBtn"),
      formMode: document.getElementById("formMode"),
      formTitle: document.getElementById("formTitle"),
      newTitle: document.getElementById("newTitle"),
      newCategory: document.getElementById("newCategory"),
      newFile: document.getElementById("newFile"),
      fileStatusInfo: document.getElementById("fileStatusInfo"),
      formAttachmentPreview: document.getElementById("formAttachmentPreview"),
      previewAttachment: document.getElementById("previewAttachment"),
      removeFileBtn: document.getElementById("removeFileBtn"),
      newText: document.getElementById("newText"),
      saveBtn: document.getElementById("saveBtn"),
      cancelBtn: document.getElementById("cancelBtn"),
      categoryFilter: document.getElementById("categoryFilter"),
      exportBtn: document.getElementById("exportBtn")
    };

    function getGreeting(date = new Date()) {
      const hour = date.getHours();
      if (hour < 12) return "Bom dia";
      if (hour < 18) return "Boa tarde";
      return "Boa noite";
    }

    function buildFinalText(template, greeting, clientName) {
      return (template || "")
        .replaceAll("{saudacao}", greeting)
        .replaceAll("{nome}", clientName.trim())
        .replace(/, !/g, "!")
        .replace(/, \n/g, "\n")
        .replace(/  +/g, " ")
        .trim();
    }

    function appendWithSmartSpacing(currentText, insertion) {
      const text = currentText || "";
      const needsSpace = text.length > 0 && !text.endsWith(" ") && !text.endsWith("\n");
      return `${text}${needsSpace ? " " : ""}${insertion}`;
    }

    const MAX_FIRESTORE_DATA_URL_CHARS = 820000;

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error || new Error("Falha ao ler arquivo"));
        reader.readAsDataURL(file);
      });
    }

    function loadImageFromDataUrl(dataUrl) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("Não foi possível carregar a imagem"));
        img.src = dataUrl;
      });
    }

    function cleanFileName(name, fallback = "imagem") {
      const base = (name || fallback).replace(/\.[^.]+$/, "").trim() || fallback;
      return base.replace(/[\\/:*?"<>|]+/g, "-");
    }

    function isImageData(fileType, fileData) {
      return (fileType || "").startsWith("image/") || (fileData || "").startsWith("data:image/");
    }

    function hasAttachment(message) {
      return Boolean(message && (message.fileData || message.fileUrl));
    }

    function readableSize(bytes) {
      if (!bytes) return "";
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${Math.round(bytes / 1024)} KB`;
      return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
    }

    function dataUrlApproxBytes(dataUrl) {
      const base64 = String(dataUrl || "").split(",")[1] || "";
      return Math.round(base64.length * 0.75);
    }

    async function compressImageFile(file) {
      if (file.size > 12000000) {
        throw new Error("Imagem acima de 12 MB. Escolha uma imagem menor.");
      }

      const originalDataUrl = await readFileAsDataUrl(file);
      const img = await loadImageFromDataUrl(originalDataUrl);
      const attempts = [
        { max: 1600, quality: 0.84 },
        { max: 1400, quality: 0.80 },
        { max: 1200, quality: 0.76 },
        { max: 1000, quality: 0.72 },
        { max: 850, quality: 0.68 },
        { max: 720, quality: 0.64 },
        { max: 600, quality: 0.60 },
        { max: 520, quality: 0.56 }
      ];

      let lastDataUrl = null;
      for (const attempt of attempts) {
        const scale = Math.min(1, attempt.max / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        lastDataUrl = canvas.toDataURL("image/jpeg", attempt.quality);
        if (lastDataUrl.length <= MAX_FIRESTORE_DATA_URL_CHARS) {
          return {
            fileData: lastDataUrl,
            fileName: `${cleanFileName(file.name)}.jpg`,
            fileType: "image/jpeg",
            fileSizeBytes: dataUrlApproxBytes(lastDataUrl)
          };
        }
      }

      throw new Error("A imagem continuou grande após a compactação. Tente enviar uma imagem menor ou recortada.");
    }

    function showAttachmentPreview(container, fileData, fileName, fileType) {
      container.innerHTML = "";
      container.classList.remove("visible");
      if (!fileData && !fileName) return;

      const name = document.createElement("div");
      name.className = "attachment-name";
      name.textContent = `📎 ${fileName || "Anexo"}`;
      container.appendChild(name);

      if (fileData && isImageData(fileType, fileData)) {
        const img = document.createElement("img");
        img.alt = fileName || "Imagem anexada";
        img.src = fileData;
        container.appendChild(img);
      }

      container.classList.add("visible");
    }

    function renderPreviewAttachment(message) {
      els.previewAttachment.innerHTML = "";
      els.previewAttachment.classList.remove("visible");
      if (!hasAttachment(message)) return;

      const fileData = message.fileData || message.fileUrl;
      const fileType = message.fileType || "";
      const fileName = message.fileName || "Anexo";
      const name = document.createElement("div");
      name.className = "attachment-name";
      name.textContent = isImageData(fileType, fileData) ? `🖼️ Imagem anexada: ${fileName}` : `📎 Anexo: ${fileName}`;
      els.previewAttachment.appendChild(name);

      if (isImageData(fileType, fileData)) {
        const img = document.createElement("img");
        img.alt = fileName;
        img.src = fileData;
        els.previewAttachment.appendChild(img);
      }
      els.previewAttachment.classList.add("visible");
    }

    function dataUrlToBlob(dataUrl) {
      const parts = String(dataUrl).split(",");
      const meta = parts[0] || "";
      const base64 = parts[1] || "";
      const mimeMatch = meta.match(/data:([^;]+)/);
      const mime = mimeMatch ? mimeMatch[1] : "application/octet-stream";
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new Blob([bytes], { type: mime });
    }

    function openAttachment(fileDataOrUrl, fileName) {
      if (!fileDataOrUrl) return;

      if (String(fileDataOrUrl).startsWith("data:")) {
        const blob = dataUrlToBlob(fileDataOrUrl);
        const objectUrl = URL.createObjectURL(blob);
        const opened = window.open(objectUrl, "_blank", "noopener");
        if (!opened) {
          const link = document.createElement("a");
          link.href = objectUrl;
          link.download = fileName || "anexo";
          document.body.appendChild(link);
          link.click();
          link.remove();
        }
        setTimeout(() => URL.revokeObjectURL(objectUrl), 60000);
        return;
      }

      window.open(fileDataOrUrl, "_blank", "noopener");
    }

    // Monitora a seleção de arquivos. Imagens são compactadas e salvas no próprio Firestore.
    // Assim não dependemos do Firebase Storage, que foi o ponto que travava em 0%.
    els.newFile.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      currentBase64File = null;
      currentFileName = null;
      currentFileType = null;
      currentFileSizeBytes = null;
      fileIsPreparing = false;
      removeExistingFile = false;
      els.fileStatusInfo.textContent = "";
      showAttachmentPreview(els.formAttachmentPreview, null, null, null);
      if (!file) return;

      try {
        fileIsPreparing = true;
        els.fileStatusInfo.textContent = `Preparando anexo: ${file.name}...`;

        if (file.type && file.type.startsWith("image/")) {
          const prepared = await compressImageFile(file);
          currentBase64File = prepared.fileData;
          currentFileName = prepared.fileName;
          currentFileType = prepared.fileType;
          currentFileSizeBytes = prepared.fileSizeBytes;
          els.fileStatusInfo.textContent = `🖼️ Imagem pronta: ${currentFileName} (${readableSize(currentFileSizeBytes)})`;
          showAttachmentPreview(els.formAttachmentPreview, currentBase64File, currentFileName, currentFileType);
          return;
        }

        if (file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf")) {
          if (file.size > 520000) {
            alert("Este PDF ainda é grande para salvar direto no Firestore. Use PDF de até 520 KB ou salve sem anexo.");
            els.newFile.value = "";
            els.fileStatusInfo.textContent = "";
            return;
          }
          currentBase64File = await readFileAsDataUrl(file);
          currentFileName = file.name;
          currentFileType = "application/pdf";
          currentFileSizeBytes = file.size;
          els.fileStatusInfo.textContent = `📄 PDF pronto: ${file.name} (${readableSize(file.size)})`;
          showAttachmentPreview(els.formAttachmentPreview, null, currentFileName, currentFileType);
          return;
        }

        alert("Formato não aceito. Use imagem ou PDF.");
        els.newFile.value = "";
        els.fileStatusInfo.textContent = "";
      } catch (error) {
        console.error(error);
        alert("Não consegui preparar este anexo. " + (error.message || "Tente uma imagem menor."));
        els.newFile.value = "";
        els.fileStatusInfo.textContent = "";
      } finally {
        fileIsPreparing = false;
      }
    });

    function startRealtimeSync() {
      onSnapshot(messagesCollection, (snapshot) => {
        messages = snapshot.docs.map((docItem) => {
          const data = docItem.data();
          return { 
            id: docItem.id, 
            useCount: 0, 
            title: "", 
            category: "Geral", 
            text: "",
            ...data 
          };
        });

        messages.sort((a, b) => {
          const titleA = (a.title || "").toLowerCase();
          const titleB = (b.title || "").toLowerCase();
          return titleA.localeCompare(titleB);
        });

        if (!selectedId && messages.length > 0) selectedId = messages[0].id;
        firebaseReady = true;
        els.syncStatus.textContent = `Sincronizado na nuvem • ${messages.length} respostas`;
        renderCategories();
        render();
      }, (error) => {
        console.error(error);
        els.syncStatus.textContent = "Erro ao conectar no Firebase: " + (error.code || error.message || "ver console");
        firebaseReady = false;
        render();
      });
    }

    function renderCategories() {
      const categories = new Set();
      let hasUsage = false;
      messages.forEach(m => { 
        if(m.category) categories.add(m.category.trim());
        if(m.useCount && m.useCount > 0) hasUsage = true;
      });
      
      els.categoryFilter.innerHTML = "";
      
      const optAll = document.createElement("option");
      optAll.value = "all";
      optAll.textContent = "📁 Filtrar por Categoria: Todas";
      if(currentSelectedCategory === "all") optAll.selected = true;
      els.categoryFilter.appendChild(optAll);

      if (hasUsage) {
        const optTop = document.createElement("option");
        optTop.value = "top_used";
        optTop.textContent = "⭐ Mais Usadas";
        if(currentSelectedCategory === "top_used") optTop.selected = true;
        els.categoryFilter.appendChild(optTop);
      }
      
      Array.from(categories).sort().forEach(cat => {
        const opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = `📁 ${cat}`;
        if(currentSelectedCategory === cat) opt.selected = true;
        els.categoryFilter.appendChild(opt);
      });
    }

    els.categoryFilter.addEventListener("change", (e) => {
      currentSelectedCategory = e.target.value;
      render();
    });

    function selectedMessage() {
      return messages.find((message) => message.id === selectedId) || filteredMessagesCache[0] || messages[0];
    }

    function render() {
      const greeting = getGreeting();
      els.greetingLabel.textContent = greeting;

      const term = els.search.value.toLowerCase().trim();
      
      let filtered = messages.filter((message) => {
        const matchesSearch = term ? `${message.title} ${message.category} ${message.text}`.toLowerCase().includes(term) : true;
        const matchesCategory = (currentSelectedCategory === "all" || currentSelectedCategory === "top_used") ? true : (message.category || "").trim() === currentSelectedCategory;
        return matchesSearch && matchesCategory;
      });

      if (currentSelectedCategory === "top_used") {
        filtered.sort((a, b) => (b.useCount || 0) - (a.useCount || 0));
      }

      filteredMessagesCache = filtered; 

      els.messageList.innerHTML = "";
      if (filtered.length === 0) {
        const empty = document.createElement("div");
        empty.className = "message-btn";
        empty.style.textAlign = "center";
        empty.style.color = "var(--muted)";
        empty.textContent = firebaseReady ? "Nenhuma resposta encontrada." : "Carregando mensagens...";
        els.messageList.appendChild(empty);
      } else {
        filtered.forEach((message) => {
          const btn = document.createElement("button");
          btn.className = `message-btn ${message.id === selectedId ? "active" : ""}`;
          btn.setAttribute("id", `msg-card-${message.id}`);
          
          const countText = message.useCount ? ` • ⏱️ ${message.useCount}x` : "";
          const hasAttachmentBadge = hasAttachment(message) ? `<span class="message-attachment-badge">${isImageData(message.fileType, message.fileData || message.fileUrl) ? "🖼️ Imagem" : "📎 Anexo"}</span>` : "";
          
          btn.innerHTML = `<div class="message-row"><div><div class="message-title"></div><div class="message-info-row"><div class="message-cat"></div>${hasAttachmentBadge}<span class="message-count"></span></div></div><div class="icons"><span class="icon edit" title="Editar">✏️</span><span class="icon delete" title="Excluir">🗑️</span></div></div>`;
          btn.querySelector(".message-title").textContent = message.title || "";
          btn.querySelector(".message-cat").textContent = message.category || "Geral";
          btn.querySelector(".message-count").textContent = countText;
          
          btn.addEventListener("click", () => { selectedId = message.id; render(); });
          btn.querySelector(".edit").addEventListener("click", (event) => { event.stopPropagation(); startEditing(message); });
          btn.querySelector(".delete").addEventListener("click", (event) => { event.stopPropagation(); deleteMessageById(message.id); });
          els.messageList.appendChild(btn);

          if (message.id === selectedId) {
            btn.scrollIntoView({ block: "nearest", behavior: "smooth" });
          }
        });
      }

      const selected = selectedMessage();
      const finalText = buildFinalText(selected?.text, greeting, els.clientName.value);
      els.previewTitle.textContent = selected?.title || "Nenhuma mensagem";
      els.previewText.textContent = finalText || "Selecione ou cadastre uma mensagem para visualizar aqui.";
      els.copyBtn.disabled = !finalText;

      // Exibe ou esconde o anexo na área de prévia
      renderPreviewAttachment(selected);
      if (selected && hasAttachment(selected)) {
        els.downloadFileBtn.style.display = "inline-flex";
        els.downloadFileBtn.textContent = isImageData(selected.fileType, selected.fileData || selected.fileUrl) ? "🖼️ Abrir imagem" : `📎 Abrir ${selected.fileName || 'Anexo'}`;
      } else {
        els.downloadFileBtn.style.display = "none";
      }

      const isEditing = editingId !== null;
      els.formMode.textContent = isEditing ? "Editando resposta" : "Nova resposta";
      els.formTitle.textContent = isEditing ? "Alterar mensagem" : "Cadastrar mensagem";
      els.saveBtn.textContent = isEditing ? "💾 Salvar alterações" : "＋ Salvar mensagem";
      els.cancelBtn.style.display = isEditing ? "inline-flex" : "none";
    }

    // Abre ou baixa o anexo quando clicado
    els.downloadFileBtn.addEventListener("click", () => {
      const selected = selectedMessage();
      if (!selected || !hasAttachment(selected)) return;
      openAttachment(selected.fileData || selected.fileUrl, selected.fileName || "arquivo_anexo");
    });

    function clearForm() {
      editingId = null;
      removeExistingFile = false;
      fileIsPreparing = false;
      els.newTitle.value = "";
      els.newCategory.value = "";
      els.newFile.value = "";
      els.newText.value = "";
      els.fileStatusInfo.textContent = "";
      els.removeFileBtn.style.display = "none";
      showAttachmentPreview(els.formAttachmentPreview, null, null, null);
      currentBase64File = null;
      currentFileName = null;
      currentFileType = null;
      currentFileSizeBytes = null;
      render();
    }

    async function saveForm() {
      const title = els.newTitle.value.trim();
      const category = els.newCategory.value.trim() || "Geral";
      const text = els.newText.value.trim();
      if (!title || !text) return;

      if (fileIsPreparing) {
        alert("A imagem ainda está sendo preparada. Aguarde aparecer 'Imagem pronta' antes de salvar.");
        return;
      }

      els.saveBtn.disabled = true;
      const originalSaveText = els.saveBtn.textContent;
      els.saveBtn.textContent = currentBase64File ? "Salvando imagem..." : "Salvando...";

      const payload = { 
        title, 
        category, 
        text, 
        updatedAt: serverTimestamp() 
      };

      if (currentBase64File) {
        payload.fileData = currentBase64File;
        payload.fileName = currentFileName || "imagem.jpg";
        payload.fileType = currentFileType || "application/octet-stream";
        payload.fileSizeBytes = currentFileSizeBytes || dataUrlApproxBytes(currentBase64File);
        payload.fileStorageMode = "firestore-base64";
      }

      try {
        if (editingId !== null) {
          if (currentBase64File) {
            // Limpa campos antigos que possam ter vindo da tentativa com Storage.
            payload.fileUrl = deleteField();
          } else if (removeExistingFile) {
            payload.fileData = deleteField();
            payload.fileUrl = deleteField();
            payload.fileName = deleteField();
            payload.fileType = deleteField();
            payload.fileSizeBytes = deleteField();
            payload.fileStorageMode = deleteField();
          }

          await updateDoc(doc(db, "messages", editingId), payload);
          selectedId = editingId;
        } else {
          payload.useCount = 0;
          payload.createdAt = serverTimestamp();
          const docRef = await addDoc(messagesCollection, payload);
          selectedId = docRef.id;
        }
        clearForm();
      } catch (error) {
        console.error(error);
        alert("Não foi possível salvar no Firebase.\n\nDetalhe: " + (error.code || error.message || error));
      } finally {
        els.saveBtn.disabled = false;
        els.saveBtn.textContent = originalSaveText;
      }
    }

    function startEditing(message) {
      editingId = message.id;
      selectedId = message.id;
      removeExistingFile = false;
      fileIsPreparing = false;
      els.newTitle.value = message.title || "";
      els.newCategory.value = message.category || "";
      els.newText.value = message.text || "";
      els.newFile.value = "";
      currentBase64File = null;
      currentFileName = null;
      currentFileType = null;
      currentFileSizeBytes = null;
      showAttachmentPreview(els.formAttachmentPreview, null, null, null);
      
      if (hasAttachment(message)) {
        els.fileStatusInfo.textContent = `⚠️ Já possui anexo: ${message.fileName || 'Sim'}. Escolha outro arquivo para substituir ou clique em remover.`;
        els.removeFileBtn.style.display = "inline-flex";
        showAttachmentPreview(els.formAttachmentPreview, message.fileData || message.fileUrl, message.fileName || "Anexo", message.fileType || "");
      } else {
        els.fileStatusInfo.textContent = "";
        els.removeFileBtn.style.display = "none";
      }
      
      render();
    }

    async function deleteMessageById(id) {
      if (!confirm("Deseja apagar esta mensagem?")) return;
      try {
        await deleteDoc(doc(db, "messages", id));
        if (selectedId === id) selectedId = null;
      } catch (error) {
        console.error(error);
        alert("Não foi possível apagar no Firebase.");
      }
    }

    async function copyText() {
      const text = els.previewText.textContent;
      if (!text) return;
      
      try { await navigator.clipboard.writeText(text); }
      catch {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand("copy");
        document.body.removeChild(textArea);
      }
      
      const currentMsg = selectedMessage();
      if (currentMsg && currentMsg.id) {
        const cardEl = document.getElementById(`msg-card-${currentMsg.id}`);
        if (cardEl) {
          cardEl.classList.remove("copied-effect");
          void cardEl.offsetWidth; 
          cardEl.classList.add("copied-effect");
        }
      }

      els.copyBtn.textContent = "✓ Copiado!";
      els.copyBtn.classList.add("success");
      setTimeout(() => { 
        els.copyBtn.textContent = "📋 Copiar"; 
        els.copyBtn.classList.remove("success");
      }, 1400);

      if (currentMsg && currentMsg.id) {
        try {
          await updateDoc(doc(db, "messages", currentMsg.id), {
            useCount: increment(1)
          });
        } catch(e) {
          console.error(e);
        }
      }
    }

    window.addEventListener("keydown", (event) => {
      if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) {
        if (event.key === "Enter" && document.activeElement === els.search) {
          els.search.blur();
          event.preventDefault();
        }
        return;
      }

      if (filteredMessagesCache.length === 0) return;
      const currentIndex = filteredMessagesCache.findIndex(m => m.id === selectedId);

      if (event.key === "ArrowDown") {
        event.preventDefault();
        const nextIndex = currentIndex + 1 < filteredMessagesCache.length ? currentIndex + 1 : 0;
        selectedId = filteredMessagesCache[nextIndex].id;
        render();
      } else if (event.key === "ArrowUp") {
        event.preventDefault();
        const prevIndex = currentIndex - 1 >= 0 ? currentIndex - 1 : filteredMessagesCache.length - 1;
        selectedId = filteredMessagesCache[prevIndex].id;
        render();
      } else if (event.key === "Enter") {
        event.preventDefault();
        copyText();
      }
    });

    function exportBackup() {
      if (messages.length === 0) {
        alert("Nenhuma mensagem para exportar.");
        return;
      }
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(messages, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `responde_facil_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    document.querySelectorAll("[data-insert]").forEach((btn) => {
      btn.addEventListener("click", () => {
        els.newText.value = appendWithSmartSpacing(els.newText.value, btn.dataset.insert);
      });
    });


    els.removeFileBtn.addEventListener("click", () => {
      if (editingId === null) return;
      removeExistingFile = true;
      currentBase64File = null;
      currentFileName = null;
      currentFileType = null;
      currentFileSizeBytes = null;
      els.newFile.value = "";
      els.fileStatusInfo.textContent = "🗑️ O anexo atual será removido ao salvar alterações.";
      els.removeFileBtn.style.display = "none";
      showAttachmentPreview(els.formAttachmentPreview, null, null, null);
    });

    els.clientName.addEventListener("input", render);
    els.search.addEventListener("input", render);
    els.copyBtn.addEventListener("click", copyText);
    els.saveBtn.addEventListener("click", saveForm);
    els.cancelBtn.addEventListener("click", clearForm);
    els.exportBtn.addEventListener("click", exportBackup);

    render();
    startRealtimeSync();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    }
  </script>
</body>
</html>
