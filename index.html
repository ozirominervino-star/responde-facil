<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111" />
  <link rel="manifest" href="manifest.json" />
  <title>Responde Fácil</title>
  <style>
    :root {
      --bg: #f5f5f4;
      --card: #ffffff;
      --text: #1c1917;
      --muted: #78716c;
      --dark: #111111;
      --soft: #f5f5f5;
      --border: #e7e5e4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    .app { max-width: 1100px; margin: 0 auto; }
    header {
      background: var(--dark);
      color: white;
      border-radius: 28px;
      padding: 24px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    header p { margin: 0 0 6px; color: #d6d3d1; font-size: 14px; }
    h1 { margin: 0; font-size: 32px; }
    h2 { margin: 0; font-size: 22px; }
    .badge {
      background: rgba(255,255,255,.12);
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 16px;
    }
    .card {
      background: var(--card);
      border-radius: 28px;
      padding: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.04);
    }
    .space > * + * { margin-top: 16px; }
    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    input, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 13px 15px;
      font-size: 15px;
      outline: none;
      background: white;
    }
    textarea { resize: vertical; min-height: 120px; }
    input:focus, textarea:focus { border-color: #111; }
    .searchbox {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 0 12px;
      background: white;
    }
    .searchbox input { border: 0; padding-left: 0; }
    .list { display: flex; flex-direction: column; gap: 8px; }
    .message-btn {
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 16px;
      text-align: left;
      background: var(--soft);
      cursor: pointer;
      color: var(--text);
    }
    .message-btn.active { background: var(--dark); color: white; }
    .message-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }
    .message-title { font-weight: 700; margin-bottom: 4px; }
    .message-cat { color: var(--muted); font-size: 14px; }
    .active .message-cat { color: #d6d3d1; }
    .icons { display: flex; gap: 8px; }
    .icon {
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      border-radius: 999px;
    }
    .preview {
      min-height: 210px;
      white-space: pre-wrap;
      background: var(--soft);
      border-radius: 24px;
      padding: 20px;
      line-height: 1.5;
    }
    .topline {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .muted { color: var(--muted); font-size: 14px; margin: 0 0 4px; }
    .hint { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
    .btn {
      border: 0;
      background: var(--dark);
      color: white;
      padding: 13px 18px;
      border-radius: 18px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
    }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.secondary {
      background: #eeeeee;
      color: var(--text);
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      border: 0;
      background: #eeeeee;
      color: var(--text);
      padding: 9px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    @media (max-width: 850px) {
      body { padding: 10px; }
      .grid, .form-grid { grid-template-columns: 1fr; }
      h1 { font-size: 26px; }
      header, .card { border-radius: 22px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <p>App de respostas rápidas</p>
        <h1>Responde Fácil</h1>
      </div>
      <div class="badge">💬 Saudação atual: <span id="greetingLabel"></span></div>
    </header>

    <main class="grid">
      <section class="card space">
        <div>
          <label>Nome do cliente</label>
          <input id="clientName" placeholder="Ex: Danilo" />
        </div>

        <div>
          <label>Buscar resposta</label>
          <div class="searchbox">
            <span>🔎</span>
            <input id="search" placeholder="Pedido mínimo, revenda, SAC..." />
          </div>
        </div>

        <div class="list" id="messageList"></div>
      </section>

      <div class="space">
        <section class="card space">
          <div class="topline">
            <div>
              <p class="muted">Prévia da resposta</p>
              <h2 id="previewTitle">Nenhuma mensagem</h2>
            </div>
            <button class="btn" id="copyBtn">📋 Copiar</button>
          </div>
          <div class="preview" id="previewText"></div>
        </section>

        <section class="card space">
          <div>
            <p class="muted" id="formMode">Nova resposta</p>
            <h2 id="formTitle">Cadastrar mensagem</h2>
            <p class="hint">Dica: use os botões abaixo para inserir os campos automáticos na mensagem.</p>
          </div>

          <div class="form-grid">
            <input id="newTitle" placeholder="Título" />
            <input id="newCategory" placeholder="Categoria" />
          </div>

          <div class="chips">
            <button class="chip" data-insert="{saudacao}">Inserir saudação</button>
            <button class="chip" data-insert="{nome}">Inserir nome</button>
            <button class="chip" data-insert="{saudacao}, {nome}! Tudo bem?">Inserir abertura completa</button>
          </div>

          <textarea id="newText" placeholder="Digite a mensagem. Use {saudacao} e {nome} onde quiser personalizar."></textarea>

          <div class="actions">
            <button class="btn" id="saveBtn">＋ Salvar mensagem</button>
            <button class="btn secondary" id="cancelBtn" style="display:none;">Cancelar edição</button>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script>
    const STORAGE_KEY = "responde_facil_messages";

    const initialMessages = [
      {
        id: 1,
        title: "Pedido mínimo",
        category: "Vendas",
        text: "{saudacao}, {nome}! Tudo bem?\\n\\nNosso pedido mínimo é de R$ 600,00. O que você gostaria de acrescentar?"
      },
      {
        id: 2,
        title: "Canal exclusivo para vendas",
        category: "Atendimento",
        text: "{saudacao}, {nome}! Tudo bem?\\n\\nEste canal é exclusivo para vendas e orçamentos. Para assuntos de SAC, por favor envie um e-mail para contato@winnerhorse.com.br."
      },
      {
        id: 3,
        title: "Revenda / representante",
        category: "Comercial",
        text: "{saudacao}, {nome}! Tudo bem?\\n\\nPara avaliarmos a possibilidade de revenda, poderia nos enviar o CNPJ, inscrição estadual, cidade de atuação, estrutura comercial e média de volume mensal de vendas?"
      },
      {
        id: 4,
        title: "Agradecimento após pedido",
        category: "Vendas",
        text: "{saudacao}, {nome}! Pedido recebido, obrigada! Vou encaminhar para conferência e já seguimos com as próximas informações."
      }
    ];

    let messages = loadMessages();
    let selectedId = messages[0]?.id || 1;
    let editingId = null;

    const els = {
      greetingLabel: document.getElementById("greetingLabel"),
      clientName: document.getElementById("clientName"),
      search: document.getElementById("search"),
      messageList: document.getElementById("messageList"),
      previewTitle: document.getElementById("previewTitle"),
      previewText: document.getElementById("previewText"),
      copyBtn: document.getElementById("copyBtn"),
      formMode: document.getElementById("formMode"),
      formTitle: document.getElementById("formTitle"),
      newTitle: document.getElementById("newTitle"),
      newCategory: document.getElementById("newCategory"),
      newText: document.getElementById("newText"),
      saveBtn: document.getElementById("saveBtn"),
      cancelBtn: document.getElementById("cancelBtn")
    };

    function getGreeting(date = new Date()) {
      const hour = date.getHours();
      if (hour < 12) return "Bom dia";
      if (hour < 18) return "Boa tarde";
      return "Boa noite";
    }

    function buildFinalText(template, greeting, clientName) {
      return (template || "")
        .replaceAll("{saudacao}", greeting)
        .replaceAll("{nome}", clientName.trim())
        .replace(/, !/g, "!")
        .replace(/, \\n/g, "\\n")
        .replace(/  +/g, " ")
        .trim();
    }

    function appendWithSmartSpacing(currentText, insertion) {
      const text = currentText || "";
      const needsSpace = text.length > 0 && !text.endsWith(" ") && !text.endsWith("\\n");
      return `${text}${needsSpace ? " " : ""}${insertion}`;
    }

    function loadMessages() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (!stored) return initialMessages;
        const parsed = JSON.parse(stored);
        return Array.isArray(parsed) && parsed.length > 0 ? parsed : initialMessages;
      } catch {
        return initialMessages;
      }
    }

    function saveMessages() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
    }

    function selectedMessage() {
      return messages.find((message) => message.id === selectedId) || messages[0];
    }

    function render() {
      const greeting = getGreeting();
      els.greetingLabel.textContent = greeting;

      const term = els.search.value.toLowerCase().trim();
      const filtered = term
        ? messages.filter((message) => `${message.title} ${message.category} ${message.text}`.toLowerCase().includes(term))
        : messages;

      els.messageList.innerHTML = "";

      if (filtered.length === 0) {
        const empty = document.createElement("div");
        empty.className = "message-btn";
        empty.textContent = "Nenhuma resposta encontrada.";
        els.messageList.appendChild(empty);
      } else {
        filtered.forEach((message) => {
          const btn = document.createElement("button");
          btn.className = `message-btn ${message.id === selectedId ? "active" : ""}`;
          btn.innerHTML = `
            <div class="message-row">
              <div>
                <div class="message-title"></div>
                <div class="message-cat"></div>
              </div>
              <div class="icons">
                <span class="icon edit" title="Editar mensagem">✏️</span>
                <span class="icon delete" title="Excluir mensagem">🗑️</span>
              </div>
            </div>
          `;
          btn.querySelector(".message-title").textContent = message.title;
          btn.querySelector(".message-cat").textContent = message.category;

          btn.addEventListener("click", () => {
            selectedId = message.id;
            render();
          });

          btn.querySelector(".edit").addEventListener("click", (event) => {
            event.stopPropagation();
            startEditing(message);
          });

          btn.querySelector(".delete").addEventListener("click", (event) => {
            event.stopPropagation();
            deleteMessage(message.id);
          });

          els.messageList.appendChild(btn);
        });
      }

      const selected = selectedMessage();
      const finalText = buildFinalText(selected?.text, greeting, els.clientName.value);
      els.previewTitle.textContent = selected?.title || "Nenhuma mensagem";
      els.previewText.textContent = finalText || "Selecione ou cadastre uma mensagem para visualizar aqui.";
      els.copyBtn.disabled = !finalText;

      const isEditing = editingId !== null;
      els.formMode.textContent = isEditing ? "Editando resposta" : "Nova resposta";
      els.formTitle.textContent = isEditing ? "Alterar mensagem" : "Cadastrar mensagem";
      els.saveBtn.textContent = isEditing ? "💾 Salvar alterações" : "＋ Salvar mensagem";
      els.cancelBtn.style.display = isEditing ? "inline-flex" : "none";
    }

    function clearForm() {
      editingId = null;
      els.newTitle.value = "";
      els.newCategory.value = "";
      els.newText.value = "";
      render();
    }

    function saveForm() {
      const title = els.newTitle.value.trim();
      const category = els.newCategory.value.trim() || "Geral";
      const text = els.newText.value.trim();

      if (!title || !text) return;

      if (editingId !== null) {
        messages = messages.map((message) =>
          message.id === editingId ? { ...message, title, category, text } : message
        );
        selectedId = editingId;
        saveMessages();
        clearForm();
        return;
      }

      const newMessage = {
        id: Date.now(),
        title,
        category,
        text
      };

      messages = [newMessage, ...messages];
      selectedId = newMessage.id;
      saveMessages();
      clearForm();
    }

    function startEditing(message) {
      editingId = message.id;
      selectedId = message.id;
      els.newTitle.value = message.title;
      els.newCategory.value = message.category;
      els.newText.value = message.text;
      render();
    }

    function deleteMessage(id) {
      messages = messages.filter((message) => message.id !== id);
      if (messages.length === 0) messages = [...initialMessages];
      if (selectedId === id) selectedId = messages[0].id;
      saveMessages();
      render();
    }

    async function copyText() {
      const text = els.previewText.textContent;
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand("copy");
        document.body.removeChild(textArea);
      }
      els.copyBtn.textContent = "Copiado";
      setTimeout(() => {
        els.copyBtn.textContent = editingId !== null ? "📋 Copiar" : "📋 Copiar";
      }, 1400);
    }

    function runSelfTests() {
      console.assert(getGreeting(new Date("2026-04-24T08:00:00")) === "Bom dia", "Teste saudação manhã falhou");
      console.assert(getGreeting(new Date("2026-04-24T13:00:00")) === "Boa tarde", "Teste saudação tarde falhou");
      console.assert(getGreeting(new Date("2026-04-24T19:00:00")) === "Boa noite", "Teste saudação noite falhou");
      console.assert(buildFinalText("{saudacao}, {nome}!", "Bom dia", "Danilo") === "Bom dia, Danilo!", "Teste com nome falhou");
      console.assert(buildFinalText("{saudacao}, {nome}!", "Bom dia", "") === "Bom dia!", "Teste sem nome falhou");
      console.assert(appendWithSmartSpacing("Olá", "{nome}") === "Olá {nome}", "Teste inserir com espaço falhou");
      console.assert(appendWithSmartSpacing("Olá ", "{nome}") === "Olá {nome}", "Teste inserir sem duplicar espaço falhou");
      console.assert(appendWithSmartSpacing("Olá\\n", "{nome}") === "Olá\\n{nome}", "Teste inserir após quebra de linha falhou");
    }

    document.querySelectorAll("[data-insert]").forEach((btn) => {
      btn.addEventListener("click", () => {
        els.newText.value = appendWithSmartSpacing(els.newText.value, btn.dataset.insert);
      });
    });

    els.clientName.addEventListener("input", render);
    els.search.addEventListener("input", render);
    els.copyBtn.addEventListener("click", copyText);
    els.saveBtn.addEventListener("click", saveForm);
    els.cancelBtn.addEventListener("click", clearForm);

    runSelfTests();
    render();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    }
  </script>
</body>
</html>
