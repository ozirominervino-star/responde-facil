<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111" />
  <link rel="manifest" href="manifest.json" />
  <title>Responde Fácil</title>
  <style>
    :root { 
      --bg: #f5f5f4; 
      --card: #ffffff; 
      --text: #1c1917; 
      --muted: #78716c; 
      --dark: #111111; 
      --soft: #f5f5f5; 
      --border: #e7e5e4; 
      --primary: #10b981; 
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--text); padding: 16px; }
    .app { max-width: 1100px; margin: 0 auto; }
    
    header { background: var(--dark); color: white; border-radius: 28px; padding: 24px; margin-bottom: 16px; display: flex; justify-content: space-between; gap: 16px; align-items: center; flex-wrap: wrap; }
    header p { margin: 0 0 6px; color: #d6d3d1; font-size: 14px; }
    h1 { margin: 0; font-size: 32px; }
    h2 { margin: 0; font-size: 22px; }
    .badge { background: rgba(255,255,255,.12); border-radius: 999px; padding: 10px 14px; font-size: 14px; }
    .status { font-size: 12px; color: #57534e; background: #eee; padding: 8px 12px; border-radius: 999px; display: inline-block; }
    
    /* Estrutura do Grid Principal Fixa Inquebrável */
    .grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 16px; align-items: start; }
    .card { background: var(--card); border-radius: 28px; padding: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.04); min-width: 0; }
    .space > * + * { margin-top: 16px; }
    
    label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 8px; }
    input, textarea, select { width: 100%; border: 1px solid var(--border); border-radius: 18px; padding: 13px 15px; font-size: 15px; outline: none; background: white; color: var(--text); }
    textarea { resize: vertical; min-height: 120px; }
    input:focus, textarea:focus, select:focus { border-color: #111; }
    
    .searchbox { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 18px; padding: 0 12px; background: white; }
    .searchbox input { border: 0; padding-left: 0; height: 46px; }
    
    /* Container do Filtro por Categoria Corrigido para Select */
    .filter-container { margin-top: 12px; }
    select.category-select { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%2378716c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>"); background-repeat: no-repeat; background-position: right 14px center; background-size: 16px; padding-right: 40px; appearance: none; cursor: pointer; font-weight: 600; }

    /* Lista com rolagem vertical controlada */
    .list { display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow-y: auto; padding-right: 4px; margin-top: 8px; }
    
    /* Cards de Mensagem */
    .message-btn { width: 100%; border: 1px solid transparent; border-radius: 18px; padding: 16px; text-align: left; background: var(--soft); cursor: pointer; color: var(--text); transition: all 0.2s; }
    .message-btn:hover { background: #e7e5e4; }
    
    /* Visualização Ativa Clara, Legível e com Contraste Elevado */
    .message-btn.active { background: var(--dark); color: white; }
    .message-btn.active .message-title { color: white; }
    .message-btn.active .message-cat { color: #d6d3d1; background: rgba(255,255,255,0.15); }
    .message-btn.active .message-count { color: #a8a29e; }
    .message-btn.active .icon { color: white; opacity: 0.8; }
    .message-btn.active .icon:hover { background: rgba(255,255,255,0.2); opacity: 1; }

    @keyframes copyFlash {
      0% { box-shadow: 0 0 0 0px rgba(16, 185, 129, 0.6); border-color: var(--primary); }
      100% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
    }
    .message-btn.copied-effect { animation: copyFlash 0.5s ease-out; }

    .message-row { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .message-title { font-weight: 700; margin-bottom: 4px; font-size: 15px; word-break: break-word; }
    .message-info-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .message-cat { color: var(--muted); font-size: 12px; background: #e7e5e4; padding: 3px 8px; border-radius: 6px; font-weight: 600; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .message-count { font-size: 11px; color: var(--muted); }
    
    .icons { display: flex; gap: 4px; flex-shrink: 0; }
    .icon { border: 0; background: transparent; cursor: pointer; font-size: 16px; padding: 6px; border-radius: 8px; color: var(--text); transition: all 0.2s; }
    .icon:hover { background: rgba(0,0,0,0.08); }
    
    .preview { min-height: 210px; white-space: pre-wrap; background: var(--soft); border-radius: 24px; padding: 20px; line-height: 1.5; font-size: 15px; border: 1px solid var(--border); word-break: break-word; }
    .topline { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
    .muted { color: var(--muted); font-size: 14px; margin: 0 0 4px; }
    .hint { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
    
    .btn { border: 0; background: var(--dark); color: white; padding: 13px 18px; border-radius: 18px; cursor: pointer; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.secondary { background: #eee; color: var(--text); }
    .btn.success { background: var(--primary); color: white; }
    
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { border: 0; background: #eee; color: var(--text); padding: 9px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; }
    .chip:hover { background: #e7e5e4; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .actions { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; width: 100%; }
    .actions-left { display: flex; gap: 8px; }
    
    @media (max-width: 850px) { 
      body { padding: 10px; } 
      .grid, .form-grid { grid-template-columns: 1fr; } 
      h1 { font-size: 26px; } 
      header, .card { border-radius: 22px; } 
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <p>App de respostas rápidas</p>
        <h1>Responde Fácil</h1>
      </div>
      <div>
        <div class="badge">💬 Saudação atual: <span id="greetingLabel"></span></div>
        <div style="height:8px"></div>
        <span class="status" id="syncStatus">Conectando ao Firebase...</span>
      </div>
    </header>

    <main class="grid">
      <section class="card space">
        <div>
          <label>Nome do cliente</label>
          <input id="clientName" placeholder="Ex: Danilo" />
        </div>
        <div>
          <label>Buscar resposta</label>
          <div class="searchbox">
            <span>🔎</span>
            <input id="search" placeholder="Pedido mínimo, revenda, SAC..." />
          </div>
          <div class="filter-container">
            <select class="category-select" id="categoryFilter">
              <option value="all">📁 Filtrar por Categoria: Todas</option>
            </select>
          </div>
        </div>
        <div class="list" id="messageList"></div>
      </section>

      <div class="space">
        <section class="card space">
          <div class="topline">
            <div>
              <p class="muted">Prévia da resposta</p>
              <h2 id="previewTitle">Nenhuma mensagem</h2>
            </div>
            <button class="btn" id="copyBtn">📋 Copiar</button>
          </div>
          <div class="preview" id="previewText"></div>
        </section>

        <section class="card space">
          <div>
            <p class="muted" id="formMode">Nova resposta</p>
            <h2 id="formTitle">Cadastrar mensagem</h2>
            <p class="hint">Dica: use os botões abaixo para inserir os campos automáticos na mensagem.</p>
          </div>
          <div class="form-grid">
            <input id="newTitle" placeholder="Título" />
            <input id="newCategory" placeholder="Categoria (Ex: Vendas, SAC)" />
          </div>
          <div class="chips">
            <button class="chip" data-insert="{saudacao}">Inserir saudação</button>
            <button class="chip" data-insert="{nome}">Inserir nome</button>
            <button class="chip" data-insert="{saudacao}, {nome}! Tudo bem?">Inserir abertura completa</button>
          </div>
          <textarea id="newText" placeholder="Digite a mensagem. Use {saudacao} e {nome} onde quiser personalizar."></textarea>
          <div class="actions">
            <div class="actions-left">
              <button class="btn" id="saveBtn">＋ Salvar mensagem</button>
              <button class="btn secondary" id="cancelBtn" style="display:none;">Cancelar edição</button>
            </div>
            <button class="btn secondary" id="exportBtn" style="font-size: 12px; padding: 10px 14px;" title="Baixar backup de segurança">💾 Exportar Backup</button>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDFnYw48YKLWSEFAiuTXWRY3Ki83AeGU88",
      authDomain: "responde-facil.firebaseapp.com",
      projectId: "responde-facil",
      storageBucket: "responde-facil.firebasestorage.app",
      messagingSenderId: "210022478525",
      appId: "1:210022478525:web:b9119b7e01259878ab7dd4",
      measurementId: "G-SRD5TDMRFM"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const messagesCollection = collection(db, "messages");

    let messages = [];
    let filteredMessagesCache = []; 
    let selectedId = null;
    let editingId = null;
    let firebaseReady = false;
    let currentSelectedCategory = "all"; 

    const els = {
      greetingLabel: document.getElementById("greetingLabel"),
      syncStatus: document.getElementById("syncStatus"),
      clientName: document.getElementById("clientName"),
      search: document.getElementById("search"),
      messageList: document.getElementById("messageList"),
      previewTitle: document.getElementById("previewTitle"),
      previewText: document.getElementById("previewText"),
      copyBtn: document.getElementById("copyBtn"),
      formMode: document.getElementById("formMode"),
      formTitle: document.getElementById("formTitle"),
      newTitle: document.getElementById("newTitle"),
      newCategory: document.getElementById("newCategory"),
      newText: document.getElementById("newText"),
      saveBtn: document.getElementById("saveBtn"),
      cancelBtn: document.getElementById("cancelBtn"),
      categoryFilter: document.getElementById("categoryFilter"),
      exportBtn: document.getElementById("exportBtn")
    };

    function getGreeting(date = new Date()) {
      const hour = date.getHours();
      if (hour < 12) return "Bom dia";
      if (hour < 18) return "Boa tarde";
      return "Boa noite";
    }

    function buildFinalText(template, greeting, clientName) {
      return (template || "")
        .replaceAll("{saudacao}", greeting)
        .replaceAll("{nome}", clientName.trim())
        .replace(/, !/g, "!")
        .replace(/, \n/g, "\n")
        .replace(/  +/g, " ")
        .trim();
    }

    function appendWithSmartSpacing(currentText, insertion) {
      const text = currentText || "";
      const needsSpace = text.length > 0 && !text.endsWith(" ") && !text.endsWith("\n");
      return `${text}${needsSpace ? " " : ""}${insertion}`;
    }

    function startRealtimeSync() {
      onSnapshot(messagesCollection, (snapshot) => {
        messages = snapshot.docs.map((docItem) => {
          const data = docItem.data();
          return { 
            id: docItem.id, 
            useCount: 0, 
            title: "", 
            category: "Geral", 
            text: "",
            createdAt: { toMillis: () => 0 },
            ...data 
          };
        });

        messages.sort((a, b) => {
          const timeA = a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;
          const timeB = b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;
          return timeA - timeB;
        });

        if (!selectedId && messages.length > 0) selectedId = messages[0].id;
        firebaseReady = true;
        els.syncStatus.textContent = "Sincronizado na nuvem";
        renderCategories();
        render();
      }, (error) => {
        console.error(error);
        els.syncStatus.textContent = "Erro ao conectar no Firebase";
        firebaseReady = false;
        render();
      });
    }

    function renderCategories() {
      const categories = new Set();
      let hasUsage = false;
      messages.forEach(m => { 
        if(m.category) categories.add(m.category.trim());
        if(m.useCount && m.useCount > 0) hasUsage = true;
      });
      
      els.categoryFilter.innerHTML = "";
      
      const optAll = document.createElement("option");
      optAll.value = "all";
      optAll.textContent = "📁 Filtrar por Categoria: Todas";
      if(currentSelectedCategory === "all") optAll.selected = true;
      els.categoryFilter.appendChild(optAll);

      if (hasUsage) {
        const optTop = document.createElement("option");
        optTop.value = "top_used";
        optTop.textContent = "⭐ Mais Usadas";
        if(currentSelectedCategory === "top_used") optTop.selected = true;
        els.categoryFilter.appendChild(optTop);
      }
      
      categories.forEach(cat => {
        const opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = `📁 ${cat}`;
        if(currentSelectedCategory === cat) opt.selected = true;
        els.categoryFilter.appendChild(opt);
      });
    }

    els.categoryFilter.addEventListener("change", (e) => {
      currentSelectedCategory = e.target.value;
      render();
    });

    function selectedMessage() {
      return messages.find((message) => message.id === selectedId) || filteredMessagesCache[0] || messages[0];
    }

    function render() {
      const greeting = getGreeting();
      els.greetingLabel.textContent = greeting;

      const term = els.search.value.toLowerCase().trim();
      
      let filtered = messages.filter((message) => {
        const matchesSearch = term ? `${message.title} ${message.category} ${message.text}`.toLowerCase().includes(term) : true;
        const matchesCategory = (currentSelectedCategory === "all" || currentSelectedCategory === "top_used") ? true : (message.category || "").trim() === currentSelectedCategory;
        return matchesSearch && matchesCategory;
      });

      if (currentSelectedCategory === "top_used") {
        filtered.sort((a, b) => (b.useCount || 0) - (a.useCount || 0));
      }

      filteredMessagesCache = filtered; 

      els.messageList.innerHTML = "";
      if (filtered.length === 0) {
        const empty = document.createElement("div");
        empty.className = "message-btn";
        empty.style.textAlign = "center";
        empty.style.color = "var(--muted)";
        empty.textContent = firebaseReady ? "Nenhuma resposta encontrada." : "Carregando mensagens...";
        els.messageList.appendChild(empty);
      } else {
        filtered.forEach((message) => {
          const btn = document.createElement("button");
          btn.className = `message-btn ${message.id === selectedId ? "active" : ""}`;
          btn.setAttribute("id", `msg-card-${message.id}`);
          
          const countText = message.useCount ? ` • ⏱️ ${message.useCount}x` : "";
          
          btn.innerHTML = `<div class="message-row"><div><div class="message-title"></div><div class="message-info-row"><div class="message-cat"></div><span class="message-count"></span></div></div><div class="icons"><span class="icon edit" title="Editar">✏️</span><span class="icon delete" title="Excluir">🗑️</span></div></div>`;
          btn.querySelector(".message-title").textContent = message.title || "";
          btn.querySelector(".message-cat").textContent = message.category || "Geral";
          btn.querySelector(".message-count").textContent = countText;
          
          btn.addEventListener("click", () => { selectedId = message.id; render(); });
          btn.querySelector(".edit").addEventListener("click", (event) => { event.stopPropagation(); startEditing(message); });
          btn.querySelector(".delete").addEventListener("click", (event) => { event.stopPropagation(); deleteMessageById(message.id); });
          els.messageList.appendChild(btn);

          if (message.id === selectedId) {
            btn.scrollIntoView({ block: "nearest", behavior: "smooth" });
          }
        });
      }

      const selected = selectedMessage();
      const finalText = buildFinalText(selected?.text, greeting, els.clientName.value);
      els.previewTitle.textContent = selected?.title || "Nenhuma mensagem";
      els.previewText.textContent = finalText || "Selecione ou cadastre uma mensagem para visualizar aqui.";
      els.copyBtn.disabled = !finalText;

      const isEditing = editingId !== null;
      els.formMode.textContent = isEditing ? "Editando resposta" : "Nova resposta";
      els.formTitle.textContent = isEditing ? "Alterar mensagem" : "Cadastrar mensagem";
      els.saveBtn.textContent = isEditing ? "💾 Salvar alterações" : "＋ Salvar mensagem";
      els.cancelBtn.style.display = isEditing ? "inline-flex" : "none";
    }

    function clearForm() {
      editingId = null;
      els.newTitle.value = "";
      els.newCategory.value = "";
      els.newText.value = "";
      render();
    }

    async function saveForm() {
      const title = els.newTitle.value.trim();
      const category = els.newCategory.value.trim() || "Geral";
      const text = els.newText.value.trim();
      if (!title || !text) return;
      els.saveBtn.disabled = true;

      try {
        if (editingId !== null) {
          await updateDoc(doc(db, "messages", editingId), { title, category, text, updatedAt: serverTimestamp() });
          selectedId = editingId;
        } else {
          const docRef = await addDoc(messagesCollection, { title, category, text, useCount: 0, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
          selectedId = docRef.id;
        }
        clearForm();
      } catch (error) {
        console.error(error);
        alert("Não foi possível salvar no Firebase.");
      } finally {
        els.saveBtn.disabled = false;
      }
    }

    function startEditing(message) {
      editingId = message.id;
      selectedId = message.id;
      els.newTitle.value = message.title || "";
      els.newCategory.value = message.category || "";
      els.newText.value = message.text || "";
      render();
    }

    async function deleteMessageById(id) {
      if (!confirm("Deseja apagar esta mensagem?")) return;
      try {
        await deleteDoc(doc(db, "messages", id));
        if (selectedId === id) selectedId = null;
